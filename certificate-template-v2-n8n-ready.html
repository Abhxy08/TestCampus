  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #7fd1e9;
    font-family: Georgia, 'Times New Roman', serif;
    padding: 30px;
  }
  .certificate {
    position: relative;
    width: 1040px;
    margin: 0 auto;
    background: #016283;
    padding: 15px;
    border-radius: 6px;
  }
  .inner {
    position: relative;
    background: #e1f0f7;
    border: 3px solid #346e84;
    border-radius: 2px;
    padding: 26px 70px 34px;
    text-align: center;
    overflow: hidden;
  }
  .ecg-bg {
    position: absolute;
    top: 0;
    height: 100%;
    width: 110px;
    opacity: 0.6;
    pointer-events: none;
  }
  .ecg-left { left: 8px; }
  .ecg-right { right: 8px; transform: scaleX(-1); }
  .content { position: relative; z-index: 1; }
  .top-art {
    width: 300px;
    display: block;
    margin: 0 auto 4px;
  }
  h1.title {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 9px;
    color: #104057;
    margin: 2px 0 4px;
    line-height: 1;
  }
  .subtitle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 20px;
  }
  .subtitle .line {
    height: 1px;
    width: 150px;
    background: #1f6481;
  }
  .subtitle .diamond {
    width: 7px; height: 7px;
    background: #1f6481;
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .subtitle span.text {
    font-size: 19px;
    letter-spacing: 6px;
    color: #104057;
    font-weight: 600;
    white-space: nowrap;
  }
  .certify-line {
    font-size: 18px;
    color: #1c2326;
    margin-bottom: 16px;
  }
  .blank {
    display: inline-block;
    min-width: 480px;
    border-bottom: 1.5px solid #16404f;
    padding-bottom: 6px;
    margin-bottom: 16px;
    font-size: 28px;
    color: #104057;
    font-weight: 700;
  }
  .body-text {
    font-size: 16px;
    color: #1c2326;
    line-height: 1.65;
    max-width: 680px;
    margin: 4px auto 0;
  }
  .body-text .club {
    color: #1f6481;
    font-weight: 700;
  }
  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 36px;
    padding: 0 20px;
  }
  .footer-col {
    width: 30%;
    text-align: center;
  }
  .sig-name {
    font-family: 'CertScript', cursive;
    font-size: 34px;
    color: #104057;
    margin-bottom: 2px;
  }
  .footer-rule {
    border-top: 1px solid #104057;
    opacity: 0.55;
    margin-bottom: 6px;
  }
  .footer-label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #3a4246;
    text-transform: uppercase;
  }
  .footer-value {
    font-size: 17px;
    color: #1c2326;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .csq-badge {
    position: absolute;
    top: 20px;
    right: 24px;
    z-index: 2;
  }
  .csq-badge img {
    width: 72px;
    height: 72px;
    display: block;
  }
  .seal {
    width: 100px;
    display: block;
    margin: 0 auto 6px;
  }
</style>
</head>
